<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>彩票助手 - 开奖记录查询与号码推荐</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">🎰</span>
        <h1>彩票助手</h1>
      </div>
      <div class="header-actions">
        <button class="btn-minimize" onclick="window.minimize()">─</button>
        <button class="btn-close" onclick="window.close()">✕</button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 左侧边栏 - 彩票选择 -->
      <aside class="sidebar">
        <div class="lottery-types">
          <button class="lottery-type-btn active" data-type="ssq" onclick="selectLottery('ssq')">
            <span class="type-icon">🔴</span>
            <div class="type-info">
              <span class="type-name">双色球</span>
              <span class="type-desc">每周二四五日开奖</span>
            </div>
          </button>
          <button class="lottery-type-btn" data-type="dlt" onclick="selectLottery('dlt')">
            <span class="type-icon">🔵</span>
            <div class="type-info">
              <span class="type-name">大乐透</span>
              <span class="type-desc">每周一三六开奖</span>
            </div>
          </button>
        </div>

        <div class="sidebar-section">
          <h3>操作面板</h3>
          <button class="btn-primary btn-large" onclick="refreshData()" id="refreshBtn">
            <span class="btn-icon">🔄</span>
            <span>获取最新记录</span>
          </button>
        </div>

        <div class="sidebar-section">
          <h3>数据状态</h3>
          <div class="status-info">
            <div class="status-item">
              <span class="status-label">数据来源</span>
              <span class="status-value" id="dataSource">本地数据</span>
            </div>
            <div class="status-item">
              <span class="status-label">更新时间</span>
              <span class="status-value" id="updateTime">--</span>
            </div>
            <div class="status-item">
              <span class="status-label">历史记录</span>
              <span class="status-value" id="recordCount">0 条</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- 中间区域 - 号码推荐 -->
      <section class="recommendation-section">
        <div class="section-header">
          <h2>🎯 智能推荐号码</h2>
        </div>
        
        <div class="recommendation-container" id="recommendationContainer">
          <!-- 推荐号码卡片将在这里生成 -->
          <div class="empty-state">
            <span class="empty-icon">💡</span>
            <p>点击"获取最新记录"按钮<br>获取分析数据后显示推荐号码</p>
          </div>
        </div>
        
        <!-- 往期推荐折叠面板 -->
        <div class="history-rec-panel" id="historyRecPanel">
          <div class="history-rec-header" onclick="toggleHistoryRec()">
            <span>📜 往期推荐</span>
            <span class="toggle-icon" id="historyRecToggle">▼</span>
          </div>
          <div class="history-rec-content" id="historyRecContent">
            <div class="history-rec-empty">暂无往期推荐记录</div>
          </div>
        </div>
      </section>

      <!-- 右侧区域 - 历史记录 -->
      <section class="history-section">
        <div class="section-header">
          <h2>📊 往期开奖记录</h2>
          <div class="history-filter">
            <select id="historyFilter" onchange="filterHistory()">
              <option value="10">显示10条</option>
              <option value="20" selected>显示20条</option>
              <option value="50">显示50条</option>
            </select>
          </div>
        </div>
        
        <div class="history-list" id="historyList">
          <!-- 历史记录将在这里生成 -->
          <div class="empty-state">
            <span class="empty-icon">📋</span>
            <p>暂无历史记录<br>请先获取最新数据</p>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部状态栏 -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="indicator online"></span>
        <span>就绪</span>
      </div>
      <div class="footer-center">
        <span>理性购彩 · 量力而行</span>
      </div>
      <div class="footer-right">
        <span>v1.0.0</span>
      </div>
    </footer>
  </div>

  <!-- 加载遮罩 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p>正在获取数据...</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
